<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>雷霆战机 | Thunder Fighter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="scanlines"></div>
        
        <!-- 顶部HUD -->
        <div class="hud">
            <div class="hud-left">
                <div class="hud-row">
                    <span class="hud-label">分数</span>
                    <span id="score" class="hud-value">0</span>
                </div>
                <div class="hud-row">
                    <span class="hud-label">金币</span>
                    <span id="coins" class="hud-value gold">0</span>
                </div>
            </div>
            <div class="hud-center">
                <div class="stage-info">
                    <span id="stage-label">第 1 关</span>
                    <div class="stage-progress-bar">
                        <div id="stage-progress" class="stage-progress-fill"></div>
                    </div>
                </div>
            </div>
            <div class="hud-right">
                <div class="hud-row">
                    <span class="hud-label">武器</span>
                    <span id="weapon-name" class="hud-value cyan">直射</span>
                    <span id="weapon-level" class="hud-value">LV.1</span>
                </div>
                <div class="hud-row">
                    <span class="hud-label">炸弹</span>
                    <span id="bomb-count" class="hud-value orange">3</span>
                </div>
            </div>
        </div>

        <!-- 生命值条 -->
        <div class="health-bar-container">
            <div class="health-bar-bg">
                <div id="health-bar" class="health-bar-fill"></div>
            </div>
            <span id="health-text" class="health-text">100 / 100</span>
        </div>

        <!-- Boss血条 -->
        <div id="boss-bar" class="boss-bar-container hidden">
            <div class="boss-label">
                <span id="boss-name">BOSS</span>
            </div>
            <div class="boss-bar-bg">
                <div id="boss-health" class="boss-bar-fill"></div>
            </div>
        </div>

        <!-- 游戏画布 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 开始界面 -->
        <div id="start-screen" class="overlay-panel">
            <div class="game-title">
                <h1 class="title-glow">雷霆战机</h1>
                <p class="title-sub">THUNDER FIGHTER</p>
            </div>
            <div class="game-info">
                <p class="info-line">自动射击 · 拖动躲避 · 收集强化</p>
            </div>
            <div class="controls-info">
                <div class="control-item"><span class="key">鼠标/触摸</span>拖动移动</div>
                <div class="control-item"><span class="key">WASD/方向键</span>键盘移动</div>
                <div class="control-item"><span class="key">B / 空格</span>释放炸弹</div>
                <div class="control-item"><span class="key">ESC</span>暂停游戏</div>
            </div>
            <button id="start-btn" class="game-btn">开始战斗</button>
        </div>

        <!-- 暂停界面 -->
        <div id="pause-screen" class="overlay-panel hidden">
            <h2 class="panel-title">游戏暂停</h2>
            <button id="resume-btn" class="game-btn">继续游戏</button>
            <button id="quit-btn" class="game-btn secondary">返回主菜单</button>
        </div>

        <!-- 游戏结束界面 -->
        <div id="game-over-screen" class="overlay-panel hidden">
            <h2 class="panel-title danger">任务失败</h2>
            <div class="result-stats">
                <div class="stat-row"><span>最终分数</span><span id="final-score">0</span></div>
                <div class="stat-row"><span>获得金币</span><span id="final-coins" class="gold">0</span></div>
                <div class="stat-row"><span>到达关卡</span><span id="final-stage">第 1 关</span></div>
                <div class="stat-row"><span>击杀敌机</span><span id="final-kills">0</span></div>
            </div>
            <button id="restart-btn" class="game-btn">重新挑战</button>
        </div>

        <!-- 关卡过渡提示 -->
        <div id="stage-banner" class="stage-banner hidden">
            <div class="banner-text">
                <span id="banner-stage">第 1 关</span>
                <span id="banner-sub">准备战斗</span>
            </div>
        </div>

        <!-- 炸弹释放闪光 -->
        <div id="bomb-flash" class="bomb-flash"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
